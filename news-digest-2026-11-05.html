<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172554">
  <title>התקציר היומי</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #172033;
      background: #f3f6fb;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 12% 0, #dceafe 0, transparent 36rem),
        #f3f6fb;
    }

    .hero {
      padding: 34px 20px 26px;
      color: #fff;
      text-align: center;
      background: linear-gradient(115deg, #172554, #1d4ed8 55%, #7c3aed);
    }

    .hero h1 { margin: 0; font-size: clamp(1.7rem, 4vw, 2.4rem); }
    .hero p { margin: 10px 0 0; color: #e0e7ff; }
    .clock { font-weight: 700; }

    main { width: min(940px, 100%); margin: 0 auto; padding: 0 18px 34px; }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 20px 0 12px;
    }

    .refresh {
      border: 0;
      border-radius: 999px;
      padding: 11px 18px;
      color: #fff;
      background: #172554;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 10px #17255426;
    }

    .refresh:hover { background: #263b78; }
    .refresh:focus-visible, .tab:focus-visible, a:focus-visible { outline: 3px solid #f59e0b; outline-offset: 3px; }
    .refresh:disabled { cursor: wait; opacity: .7; }
    .status { min-height: 1.5em; color: #526078; font-size: .92rem; }

    nav {
      position: sticky;
      z-index: 1;
      top: 0;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 12px 0;
      background: #f3f6fbeF;
      backdrop-filter: blur(10px);
    }

    .tab {
      border: 2px solid var(--accent);
      border-radius: 999px;
      padding: 10px 20px;
      color: var(--accent);
      background: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .tab[aria-selected="true"] { color: #fff; background: var(--accent); }
    .panel { display: none; }
    .panel.active { display: block; animation: appear .24s ease-out; }
    @keyframes appear { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin: 18px 2px 12px;
      color: var(--accent);
    }

    .section-heading h2 { margin: 0; font-size: 1.45rem; }
    .section-heading span { color: #667085; font-size: .88rem; }

    .card {
      display: flex;
      gap: 14px;
      margin: 12px 0;
      padding: 17px;
      border-right: 5px solid var(--accent);
      border-radius: 13px;
      background: #fff;
      box-shadow: 0 3px 12px #1725540d;
    }

    .icon { flex: 0 0 36px; font-size: 1.65rem; text-align: center; }
    .card-content { min-width: 0; }
    .card h3 { margin: 1px 0 7px; font-size: 1.06rem; line-height: 1.55; }
    .card p { margin: 0 0 10px; color: #4b5565; line-height: 1.6; }
    .card-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: #667085; font-size: .83rem; }
    .card a { color: var(--accent); font-weight: 700; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .empty { padding: 24px; border-radius: 12px; color: #526078; background: #fff; text-align: center; }

    footer { padding: 0 18px 28px; color: #667085; text-align: center; font-size: .84rem; line-height: 1.6; }

    @media (max-width: 560px) {
      .hero { padding: 27px 16px 21px; }
      .toolbar { align-items: flex-start; flex-direction: column; }
      nav { gap: 6px; }
      .tab { padding: 9px 12px; font-size: .9rem; }
      .section-heading { align-items: flex-start; flex-direction: column; }
      .card { gap: 9px; padding: 14px 12px; }
      .icon { flex-basis: 30px; font-size: 1.4rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <h1>📰 התקציר היומי</h1>
    <p>חמש ידיעות בכל נושא · ללא חדשות ספורט</p>
    <p class="clock" id="clock" aria-live="off"></p>
  </header>

  <main>
    <div class="toolbar">
      <button class="refresh" id="refresh" type="button">🔄 רענון חדשות</button>
      <div class="status" id="status" role="status" aria-live="polite">מתחבר למקורות החדשות…</div>
    </div>

    <nav role="tablist" aria-label="קטגוריות חדשות">
      <button class="tab" id="tab-il" type="button" role="tab" aria-selected="true" aria-controls="il" tabindex="0" data-tab="il" style="--accent:#1769aa">🇮🇱 בארץ</button>
      <button class="tab" id="tab-world" type="button" role="tab" aria-selected="false" aria-controls="world" tabindex="-1" data-tab="world" style="--accent:#21845b">🌍 בעולם</button>
      <button class="tab" id="tab-gossip" type="button" role="tab" aria-selected="false" aria-controls="gossip" tabindex="-1" data-tab="gossip" style="--accent:#c13b76">🌟 רכילות</button>
    </nav>

    <section class="panel active" id="il" role="tabpanel" aria-labelledby="tab-il" style="--accent:#1769aa">
      <div class="section-heading"><h2>🇮🇱 חדשות בארץ</h2><span class="count"></span></div>
      <div class="stories" aria-live="polite"></div>
    </section>
    <section class="panel" id="world" role="tabpanel" aria-labelledby="tab-world" style="--accent:#21845b">
      <div class="section-heading"><h2>🌍 חדשות בעולם</h2><span class="count"></span></div>
      <div class="stories" aria-live="polite"></div>
    </section>
    <section class="panel" id="gossip" role="tabpanel" aria-labelledby="tab-gossip" style="--accent:#c13b76">
      <div class="section-heading"><h2>🌟 רכילות</h2><span class="count"></span></div>
      <div class="stories" aria-live="polite"></div>
    </section>
  </main>

  <footer>
    הידיעות מגיעות דרך Google News ממקורות חדשות שונים; לחצו על קישור המקור לקריאת הכתבה המלאה.
    <br>רענון אוטומטי מתבצע בכל יום בשעה 08:00 לפי שעון ישראל כל עוד הדף פתוח.
  </footer>

  <script>
    const categories = {
      il: {
        icon: "📰",
        query: '(site:ynet.co.il OR site:mako.co.il OR site:kan.org.il OR site:haaretz.co.il OR site:israelhayom.co.il) -ספורט -כדורגל -כדורסל when:1d'
      },
      world: {
        icon: "🌐",
        query: '(site:reuters.com OR site:apnews.com OR site:bbc.com/news OR site:theguardian.com/world) -sport -sports when:1d'
      },
      gossip: {
        icon: "✨",
        query: '(site:tmi.maariv.co.il OR site:mako.co.il/entertainment-celebs OR site:pplus.ynet.co.il OR site:celebs.walla.co.il) (רכילות OR סלבס OR בידור) when:1d'
      }
    };

    const sportsPattern = /ספורט|כדורגל|כדורסל|טניס|פורמולה.?1|ליגת האלופות|\b(?:sports?|football|soccer|basketball|tennis|nba|nfl|f1)\b/i;
    const refreshButton = document.getElementById("refresh");
    const status = document.getElementById("status");
    let isRefreshing = false;
    let lastAutomaticRefreshDate = "";

    function israelParts(date = new Date()) {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Jerusalem",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        weekday: "long",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      }).formatToParts(date).reduce((result, part) => {
        result[part.type] = part.value;
        return result;
      }, {});
    }

    function updateClock() {
      document.getElementById("clock").textContent =
        "🕒 " + new Intl.DateTimeFormat("he-IL", {
          timeZone: "Asia/Jerusalem",
          weekday: "long",
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          hourCycle: "h23"
        }).format(new Date()) + " · שעון ישראל";
    }

    function cleanText(value) {
      const doc = new DOMParser().parseFromString(value || "", "text/html");
      return (doc.body.textContent || "").replace(/\s+/g, " ").trim();
    }

    function unpackItem(item) {
      const fullTitle = cleanText(item.title);
      const sourceMatch = fullTitle.match(/\s[-–]\s([^–-]+)$/);
      const title = sourceMatch ? fullTitle.slice(0, sourceMatch.index).trim() : fullTitle;
      const source = sourceMatch ? sourceMatch[1].trim() : "Google News";
      const description = cleanText(item.description);
      const summary = description && description !== fullTitle && description !== title
        ? description
        : "תקציר נוסף לא סופק במקור. לחצו על הקישור לקריאת הפרטים המלאים.";
      const date = item.pubDate ? new Date(item.pubDate) : null;

      return {
        title,
        source,
        summary,
        date: date && !Number.isNaN(date.getTime()) ? date : null,
        link: item.link
      };
    }

    function renderStories(id, items) {
      const panel = document.getElementById(id);
      const stories = panel.querySelector(".stories");
      const count = panel.querySelector(".count");
      stories.replaceChildren();
      count.textContent = items.length ? `${items.length} ידיעות` : "";

      if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "לא נמצאו ידיעות עדכניות בקטגוריה זו. נסו לרענן מאוחר יותר.";
        stories.append(empty);
        return;
      }

      items.forEach((item, index) => {
        const card = document.createElement("article");
        card.className = "card";

        const icon = document.createElement("span");
        icon.className = "icon";
        icon.setAttribute("aria-hidden", "true");
        icon.textContent = index === 0 ? categories[id].icon : "•";

        const content = document.createElement("div");
        content.className = "card-content";
        const title = document.createElement("h3");
        title.textContent = item.title;
        const summary = document.createElement("p");
        summary.textContent = item.summary;

        const meta = document.createElement("div");
        meta.className = "card-meta";
        const source = document.createElement("span");
        source.textContent = `מקור: ${item.source}`;
        meta.append(source);
        if (item.date) {
          const time = document.createElement("time");
          time.dateTime = item.date.toISOString();
          time.textContent = new Intl.DateTimeFormat("he-IL", {
            timeZone: "Asia/Jerusalem",
            day: "2-digit",
            month: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            hourCycle: "h23"
          }).format(item.date);
          meta.append(time);
        }

        const link = document.createElement("a");
        link.href = item.link;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "לכתבה המלאה ↗";
        meta.append(link);
        content.append(title, summary, meta);
        card.append(icon, content);
        stories.append(card);
      });
    }

    async function loadCategory(id) {
      const feedUrl = new URL("https://news.google.com/rss/search");
      feedUrl.search = new URLSearchParams({
        q: categories[id].query,
        hl: id === "world" ? "en-US" : "he",
        gl: id === "world" ? "US" : "IL",
        ceid: id === "world" ? "US:en" : "IL:he"
      });
      const endpoint = new URL("https://api.rss2json.com/v1/api.json");
      endpoint.searchParams.set("rss_url", feedUrl.toString());

      const response = await fetch(endpoint, { cache: "no-store" });
      if (!response.ok) throw new Error(`שירות החדשות החזיר שגיאה (${response.status})`);
      const data = await response.json();
      if (data.status !== "ok" || !Array.isArray(data.items)) {
        throw new Error(data.message || "לא התקבלו ידיעות ממקור החדשות");
      }

      const items = data.items
        .map(unpackItem)
        .filter(item => item.title && item.link && /^https:\/\//i.test(item.link))
        .filter(item => !sportsPattern.test(`${item.title} ${item.summary}`))
        .slice(0, 5);
      renderStories(id, items);
      return items.length;
    }

    async function refreshNews(automatic = false) {
      if (isRefreshing) return;
      isRefreshing = true;
      refreshButton.disabled = true;
      status.textContent = "מעדכן ידיעות ממקורות החדשות…";

      try {
        const results = await Promise.allSettled(
          Object.keys(categories).map(id => loadCategory(id))
        );
        const errors = results.filter(result => result.status === "rejected");
        const total = results.reduce((sum, result) =>
          sum + (result.status === "fulfilled" ? result.value : 0), 0);

        if (errors.length === results.length) {
          throw new Error(errors.map(result => result.reason.message).join(" · "));
        }
        if (errors.length) {
          status.textContent = `עודכנו ${total} ידיעות; חלק מהקטגוריות לא נטענו. ${errors[0].reason.message}`;
        } else {
          const time = new Intl.DateTimeFormat("he-IL", {
            timeZone: "Asia/Jerusalem",
            hour: "2-digit",
            minute: "2-digit",
            hourCycle: "h23"
          }).format(new Date());
          status.textContent = `${automatic ? "רענון אוטומטי" : "עודכן"} · ${total} ידיעות · ${time} (שעון ישראל)`;
        }
      } catch (error) {
        status.textContent = `העדכון נכשל: ${error.message}. אפשר לנסות שוב באמצעות הכפתור.`;
      } finally {
        isRefreshing = false;
        refreshButton.disabled = false;
      }
    }

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => selectTab(tab));
      tab.addEventListener("keydown", event => {
        if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
        event.preventDefault();
        const tabs = [...document.querySelectorAll(".tab")];
        const current = tabs.indexOf(tab);
        const next = event.key === "Home" ? 0
          : event.key === "End" ? tabs.length - 1
          : (current + (event.key === "ArrowLeft" ? 1 : -1) + tabs.length) % tabs.length;
        selectTab(tabs[next]);
        tabs[next].focus();
      });
    });

    function selectTab(selected) {
      document.querySelectorAll(".tab").forEach(tab => {
        const active = tab === selected;
        tab.setAttribute("aria-selected", String(active));
        tab.tabIndex = active ? 0 : -1;
      });
      document.querySelectorAll(".panel").forEach(panel => {
        panel.classList.toggle("active", panel.id === selected.dataset.tab);
      });
    }

    refreshButton.addEventListener("click", () => refreshNews());
    updateClock();
    setInterval(updateClock, 1000);
    refreshNews();

    setInterval(() => {
      const now = israelParts();
      const israelDate = `${now.year}-${now.month}-${now.day}`;
      if (now.hour === "08" && now.minute === "00" && lastAutomaticRefreshDate !== israelDate) {
        lastAutomaticRefreshDate = israelDate;
        refreshNews(true);
      }
    }, 15000);
  </script>
</body>
</html>
