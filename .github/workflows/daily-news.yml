# Runs the news agent twice an hour (:07, :37) from 06:00 to 23:00 Israel time (morning digest: 08:07)
# and publishes the site to GitHub Pages.
# GitHub cron is UTC-only: 03:00-21:00 UTC covers 06:00-23:00 Israel time in both summer (+3) and
# winter (+2); the "check" step skips the runs that fall outside those Israel hours.
name: Daily News

on:
  schedule:
    # Not on :00 - GitHub delays or drops top-of-hour schedules under load
    - cron: "7,37 3-21 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check Israel time
        id: check
        shell: python
        env:
          EVENT: ${{ github.event_name }}
        run: |
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          hour = datetime.now(ZoneInfo("Asia/Jerusalem")).hour
          run = os.environ["EVENT"] != "schedule" or 6 <= hour <= 23
          print(f"Israel hour {hour:02d}, run = {run}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"run={'true' if run else 'false'}\n")

      - uses: actions/checkout@v4
        if: steps.check.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.run == 'true'
        with:
          python-version: "3.13"

      - name: Run news agent
        if: steps.check.outputs.run == 'true'
        env:
          # Claude summaries: set repo variable USE_CLAUDE=true and secret ANTHROPIC_API_KEY
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo '{"use_claude": ${{ vars.USE_CLAUDE == 'true' }}}' > config.json
          python agent.py
          mkdir -p site
          cp index.html news-data.js apple-touch-icon.png site/

      - uses: actions/configure-pages@v5
        if: steps.check.outputs.run == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.run == 'true'
        with:
          path: site

      - id: deploy
        if: steps.check.outputs.run == 'true'
        uses: actions/deploy-pages@v4
