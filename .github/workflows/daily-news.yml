# Runs the news agent every day at 08:00 Israel time and publishes the site to GitHub Pages.
# GitHub cron is UTC-only: 05:00 UTC = 08:00 in Israeli summer time, 06:00 UTC = 08:00 in winter.
# Both are scheduled, and the "check" step keeps only the one that matches today's Israel offset.
name: Daily News

on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check Israel time
        id: check
        shell: python
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          offset = datetime.now(ZoneInfo("Asia/Jerusalem")).utcoffset().total_seconds() / 3600
          expected = "0 5 * * *" if offset == 3 else "0 6 * * *"
          run = os.environ["EVENT"] != "schedule" or os.environ["SCHEDULE"] == expected
          print(f"Israel UTC offset {offset:+.0f}, run = {run}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"run={'true' if run else 'false'}\n")

      - uses: actions/checkout@v4
        if: steps.check.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.run == 'true'
        with:
          python-version: "3.13"

      - name: Run news agent
        if: steps.check.outputs.run == 'true'
        env:
          # Claude summaries: set repo variable USE_CLAUDE=true and secret ANTHROPIC_API_KEY
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo '{"use_claude": ${{ vars.USE_CLAUDE == 'true' }}}' > config.json
          python agent.py
          mkdir -p site
          cp index.html news-data.js apple-touch-icon.png site/

      - uses: actions/configure-pages@v5
        if: steps.check.outputs.run == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.run == 'true'
        with:
          path: site

      - id: deploy
        if: steps.check.outputs.run == 'true'
        uses: actions/deploy-pages@v4
