<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172554">
  <title>התקציר היומי</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #172033;
      background: #f3f6fb;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 12% 0, #dceafe 0, transparent 36rem),
        #f3f6fb;
    }

    .hero {
      padding: 16px 20px;
      color: #fff;
      background: linear-gradient(115deg, #172554, #1d4ed8 55%, #7c3aed);
    }

    .hero-row {
      display: flex;
      align-items: center;
      gap: 12px 24px;
      width: min(940px, 100%);
      margin: 0 auto;
    }

    .hero h1 { margin: 0; font-size: clamp(1.4rem, 3.4vw, 1.9rem); white-space: nowrap; }
    .hero-info { flex: 1; min-width: 0; }
    .clock { margin: 0; font-size: 1rem; font-weight: 700; }

    main { width: min(940px, 100%); margin: 0 auto; padding: 0 18px 34px; }

    .refresh {
      flex: none;
      border: 0;
      border-radius: 999px;
      padding: 10px 18px;
      color: #172554;
      background: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 10px #0f172a40;
    }

    .refresh:hover { background: #e0e7ff; }

    .hero-actions { flex: none; display: flex; flex-direction: column; align-items: center; gap: 8px; }

    .ai-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .9rem;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }
    .ai-toggle input { position: absolute; opacity: 0; pointer-events: none; }
    .switch {
      position: relative;
      width: 40px;
      height: 22px;
      border-radius: 999px;
      background: #ffffff40;
      transition: background .15s;
    }
    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      right: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: transform .15s;
    }
    .ai-toggle input:checked + .switch { background: #f59e0b; }
    .ai-toggle input:checked + .switch::after { transform: translateX(-18px); }
    .ai-toggle input:focus-visible + .switch { outline: 3px solid #f59e0b; outline-offset: 2px; }
    .ai-toggle.disabled { cursor: not-allowed; opacity: .55; }
    .flag { width: 1.35em; height: 1em; vertical-align: -.12em; border-radius: 2px; box-shadow: 0 0 0 1px #0000001a; }
    .refresh:focus-visible, .tab:focus-visible, a:focus-visible { outline: 3px solid #f59e0b; outline-offset: 3px; }
    .refresh:disabled { cursor: wait; opacity: .7; }
    .refresh.spinning .spin { display: inline-block; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { margin-top: 2px; color: #c7d2fe; font-size: .88rem; }

    nav {
      position: sticky;
      z-index: 1;
      top: 0;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 12px 0;
      background: #f3f6fbef;
      backdrop-filter: blur(10px);
    }

    .tab {
      border: 2px solid var(--accent);
      border-radius: 999px;
      padding: 10px 20px;
      color: var(--accent);
      background: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, color .15s;
    }

    .tab[aria-selected="true"] { color: #fff; background: var(--accent); box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 35%, transparent); }
    .panel { display: none; }
    .panel.active { display: block; animation: appear .24s ease-out; }
    @keyframes appear { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin: 18px 2px 12px;
      color: var(--accent);
    }

    .section-heading h2 { margin: 0; font-size: 1.45rem; }
    .section-heading span { color: #667085; font-size: .88rem; }

    .card {
      display: flex;
      gap: 14px;
      margin: 12px 0;
      padding: 17px;
      border-right: 5px solid var(--accent);
      border-radius: 13px;
      background: #fff;
      box-shadow: 0 3px 12px #1725540d;
    }

    .icon {
      flex: 0 0 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      font-size: 1.5rem;
      background: color-mix(in srgb, var(--accent) 12%, #fff);
    }
    .card-content { min-width: 0; }
    .card h3 { margin: 1px 0 7px; font-size: 1.08rem; font-weight: 800; line-height: 1.55; }
    .card p { margin: 0 0 10px; color: #4b5565; line-height: 1.6; }
    .card-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: #667085; font-size: .83rem; }
    .card a { color: var(--accent); font-weight: 700; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .empty { padding: 24px; border-radius: 12px; color: #526078; background: #fff; text-align: center; }

    footer { padding: 0 18px 28px; color: #667085; text-align: center; font-size: .84rem; line-height: 1.6; }

    @media (max-width: 560px) {
      .hero { padding: 14px 16px; }
      .hero-row { flex-wrap: wrap; }
      .hero h1 { white-space: normal; }
      .hero-info { order: 3; flex-basis: 100%; }
      nav { gap: 6px; }
      .tab { padding: 9px 12px; font-size: .9rem; }
      .section-heading { align-items: flex-start; flex-direction: column; }
      .card { gap: 10px; padding: 14px 12px; }
      .icon { flex-basis: 38px; height: 38px; font-size: 1.25rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="flag-il" viewBox="0 0 220 160">
      <rect width="220" height="160" fill="#fff"/>
      <rect y="15" width="220" height="25" fill="#0038b8"/>
      <rect y="120" width="220" height="25" fill="#0038b8"/>
      <g fill="none" stroke="#0038b8" stroke-width="5.5">
        <path d="M110 47 142 102H78Z"/>
        <path d="M110 113 78 58H142Z"/>
      </g>
    </symbol>
  </svg>

  <header class="hero">
    <div class="hero-row">
      <h1>📰 התקציר היומי</h1>
      <div class="hero-info">
        <p class="clock" id="clock"></p>
        <div class="status" id="status" role="status" aria-live="polite">טוען ידיעות…</div>
      </div>
      <div class="hero-actions">
        <button class="refresh" id="refresh" type="button"><span class="spin">🔄</span> רענון חדשות</button>
        <label class="ai-toggle disabled" id="ai-toggle" title="זמין רק כשהאתר נפתח דרך start-news.bat">
          <input type="checkbox" id="use-claude" disabled>
          <span class="switch" aria-hidden="true"></span>
          ✨ סיכומי Claude
        </label>
      </div>
    </div>
  </header>

  <main>

    <nav role="tablist" aria-label="קטגוריות חדשות">
      <button class="tab" id="tab-il" type="button" role="tab" aria-selected="true" aria-controls="il" tabindex="0" data-tab="il" style="--accent:#1769aa"><svg class="flag" aria-hidden="true"><use href="#flag-il"/></svg> בארץ</button>
      <button class="tab" id="tab-world" type="button" role="tab" aria-selected="false" aria-controls="world" tabindex="-1" data-tab="world" style="--accent:#21845b">🌍 בעולם</button>
      <button class="tab" id="tab-gossip" type="button" role="tab" aria-selected="false" aria-controls="gossip" tabindex="-1" data-tab="gossip" style="--accent:#c13b76">🌟 רכילות</button>
    </nav>

    <section class="panel active" id="il" role="tabpanel" aria-labelledby="tab-il" style="--accent:#1769aa">
      <div class="section-heading"><h2><svg class="flag" aria-hidden="true"><use href="#flag-il"/></svg> חדשות בארץ</h2><span class="count"></span></div>
      <div class="stories"></div>
    </section>
    <section class="panel" id="world" role="tabpanel" aria-labelledby="tab-world" style="--accent:#21845b">
      <div class="section-heading"><h2>🌍 חדשות בעולם</h2><span class="count"></span></div>
      <div class="stories"></div>
    </section>
    <section class="panel" id="gossip" role="tabpanel" aria-labelledby="tab-gossip" style="--accent:#c13b76">
      <div class="section-heading"><h2>🌟 רכילות</h2><span class="count"></span></div>
      <div class="stories"></div>
    </section>
  </main>

  <footer>
    הידיעות נאספות ממקורות חדשות מובילים (ynet, מעריב, ישראל היום, וואלה, BBC, The Guardian, mako סלבס, וואלה סלבס ו־TMI מעריב).
    <br>לחצו על קישור המקור לקריאת הכתבה המלאה.
  </footer>

  <script src="news-data.js"></script>
  <script>
    const refreshButton = document.getElementById("refresh");
    const status = document.getElementById("status");
    let lastAutomaticReload = "";

    function israelParts(date = new Date()) {
      return new Intl.DateTimeFormat("he-IL", {
        timeZone: "Asia/Jerusalem",
        weekday: "long",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      }).formatToParts(date).reduce((result, part) => {
        result[part.type] = part.value;
        return result;
      }, {});
    }

    // לדוגמה: יום חמישי 05.11.2026 בשעה 11:47
    function formatIsrael(date) {
      const p = israelParts(date);
      return `${p.weekday} ${p.day}.${p.month}.${p.year} בשעה ${p.hour}:${p.minute}`;
    }

    function updateClock() {
      document.getElementById("clock").textContent = `🕒 ${formatIsrael(new Date())} לפי שעון ישראל`;
    }

    function renderStories(id, items) {
      const panel = document.getElementById(id);
      const stories = panel.querySelector(".stories");
      panel.querySelector(".count").textContent = items.length ? `${items.length} ידיעות` : "";
      stories.replaceChildren();

      if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "לא נמצאו ידיעות עדכניות בקטגוריה זו. נסו לרענן מאוחר יותר.";
        stories.append(empty);
        return;
      }

      for (const item of items) {
        const card = document.createElement("article");
        card.className = "card";

        const icon = document.createElement("span");
        icon.className = "icon";
        icon.setAttribute("aria-hidden", "true");
        icon.textContent = item.icon;

        const content = document.createElement("div");
        content.className = "card-content";
        const headline = document.createElement("h3");
        headline.textContent = item.headline;
        const summary = document.createElement("p");
        summary.textContent = item.summary;

        const meta = document.createElement("div");
        meta.className = "card-meta";
        const source = document.createElement("span");
        source.textContent = `מקור: ${item.source}`;
        meta.append(source);
        if (item.published) {
          const time = document.createElement("time");
          const p = israelParts(new Date(item.published));
          time.dateTime = item.published;
          time.textContent = `${p.day}.${p.month} · ${p.hour}:${p.minute}`;
          meta.append(time);
        }
        const link = document.createElement("a");
        link.href = item.link;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "לכתבה המלאה ↗";
        meta.append(link);

        content.append(headline, summary, meta);
        card.append(icon, content);
        stories.append(card);
      }
    }

    function render(data) {
      if (!data) {
        status.textContent = "עדיין אין נתונים. הריצו את הסוכן (python agent.py) או לחצו על רענון.";
        return;
      }
      for (const id of ["il", "world", "gossip"]) renderStories(id, data.categories[id] || []);
      const engine = data.engine === "claude" ? "סיכומי Claude" : "תקצירי המקור";
      const updated = israelParts(new Date(data.generated));
      const today = israelParts();
      const when = updated.day === today.day && updated.month === today.month
        ? `היום ב־${updated.hour}:${updated.minute}`
        : formatIsrael(new Date(data.generated));
      status.textContent = `עודכן ${when} · ${engine}`;
    }

    // טעינה מחדש של קובץ הנתונים (מתאים גם כשהדף נפתח ישירות מהקובץ)
    function reloadDataFile() {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = `news-data.js?t=${Date.now()}`;
        script.onload = () => { script.remove(); resolve(window.NEWS_DATA); };
        script.onerror = () => { script.remove(); reject(new Error("קובץ הנתונים לא נמצא")); };
        document.head.append(script);
      });
    }

    async function refreshNews() {
      refreshButton.disabled = true;
      refreshButton.classList.add("spinning");
      status.textContent = "הסוכן אוסף ומסכם ידיעות מהמקורות…";
      try {
        let data;
        if (location.protocol.startsWith("http")) {
          const response = await fetch("api/refresh", { method: "POST" });
          data = await response.json();
          if (!response.ok) throw new Error(data.error || `שגיאה ${response.status}`);
        } else {
          data = await reloadDataFile();
          status.dataset.note = "לרענון מלא מהמקורות יש להפעיל את server.py";
        }
        render(data);
        if (status.dataset.note) status.textContent += ` · ${status.dataset.note}`;
      } catch (error) {
        status.textContent = `הרענון נכשל: ${error.message}. נסו שוב בעוד רגע.`;
      } finally {
        refreshButton.disabled = false;
        refreshButton.classList.remove("spinning");
      }
    }

    function selectTab(selected) {
      document.querySelectorAll(".tab").forEach(tab => {
        const active = tab === selected;
        tab.setAttribute("aria-selected", String(active));
        tab.tabIndex = active ? 0 : -1;
      });
      document.querySelectorAll(".panel").forEach(panel => {
        panel.classList.toggle("active", panel.id === selected.dataset.tab);
      });
    }

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => selectTab(tab));
      tab.addEventListener("keydown", event => {
        if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
        event.preventDefault();
        const tabs = [...document.querySelectorAll(".tab")];
        const current = tabs.indexOf(tab);
        const next = event.key === "Home" ? 0
          : event.key === "End" ? tabs.length - 1
          : (current + (event.key === "ArrowLeft" ? 1 : -1) + tabs.length) % tabs.length;
        selectTab(tabs[next]);
        tabs[next].focus();
      });
    });

    // מתג סיכומי Claude: נשמר ב-config.json דרך השרת, ומשפיע מהרענון הבא
    const aiToggle = document.getElementById("ai-toggle");
    const useClaude = document.getElementById("use-claude");

    function showConfig(config) {
      useClaude.checked = config.use_claude;
      useClaude.disabled = !config.key_available;
      aiToggle.classList.toggle("disabled", !config.key_available);
      aiToggle.title = config.key_available
        ? "שימוש במפתח API לסיכום ותרגום הידיעות (בתשלום נפרד מהמנוי)"
        : "לא הוגדר מפתח API (ANTHROPIC_API_KEY)";
    }

    if (location.protocol.startsWith("http")) {
      fetch("api/config").then(r => r.json()).then(showConfig).catch(() => {});
    }

    useClaude.addEventListener("change", async () => {
      try {
        const response = await fetch("api/config", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ use_claude: useClaude.checked })
        });
        const config = await response.json();
        if (!response.ok) throw new Error(config.error);
        showConfig(config);
        status.textContent = config.use_claude
          ? "סיכומי Claude הופעלו · לחצו על רענון כדי להחיל"
          : "סיכומי Claude כובו · לחצו על רענון כדי להחיל";
      } catch (error) {
        useClaude.checked = !useClaude.checked;
        status.textContent = `שמירת ההגדרה נכשלה: ${error.message}`;
      }
    });

    refreshButton.addEventListener("click", refreshNews);
    updateClock();
    setInterval(updateClock, 1000);
    render(window.NEWS_DATA);

    // הסוכן מתעדכן ב־08:00; דף פתוח טוען את התקציר החדש כמה דקות אחר כך
    setInterval(() => {
      const p = israelParts();
      const today = `${p.year}-${p.month}-${p.day}`;
      if (p.hour === "08" && p.minute >= "03" && lastAutomaticReload !== today) {
        lastAutomaticReload = today;
        reloadDataFile().then(render).catch(() => {});
      }
    }, 30000);
  </script>
</body>
</html>
